version: '3.8'

services:
  # Service de l'API FastAPI et de vos pipelines IA
  api:
    build: .
    container_name: ai_production_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - REDIS_HOST=redis_cache
      - REDIS_PORT=6379
    depends_on:
      - redis_cache

  # Service de mise en cache Redis (utilisé par votre cache_pipeline.py)
  redis_cache:
    image: redis:7-alpine
    container_name: redis_cache_db
    ports:
      - "6379:6379"
